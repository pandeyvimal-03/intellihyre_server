[project]
name = "intelli-hyre"
version = "0.1.0"
description = ""

authors = [
    {name = "vimal"}
]



requires-python = ">=3.13"
dependencies = [
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt==4.0.1",
    "alembic (>=1.18.4,<2.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "pdfplumber (>=0.11.9,<0.12.0)",
    "openai (>=2.34.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-multipart (>=0.0.27,<0.0.28)",
    "opencv-python-headless (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "redis[asyncio] (>=7.4.0,<8.0.0)",
    "greenlet (>=3.5.0,<4.0.0)",
    "websockets (>=16.0,<17.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "pyright (>=1.1.409,<2.0.0)"
]
