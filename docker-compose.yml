services:
  db:
    image: postgres:15-alpine
    container_name: intellihyre_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intellihyre
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: intellihyre_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build: .
    container_name: intellihyre_server
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@intellihyre_db:5432/intellihyre
      - REDIS_URL=redis://intellihyre_redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  postgres_data:
